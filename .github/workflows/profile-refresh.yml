name: Refresh Profile Telemetry & Assets

on:
  schedule:
    # Run once daily at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Dynamic Assets & Telemetry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_assets.py

      - name: Validate Profile Integrity
        run: |
          python scripts/validate_profile.py

      - name: Commit and Push Changes If Any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check for changes in tracked files and assets
          if [ -n "$(git status --porcelain assets/ README.md)" ]; then
            git add assets/ README.md
            git commit -m "chore(telemetry): auto-refresh profile metrics and generated assets [skip ci]"
            git push
          else
            echo "No telemetry changes detected. Clean working tree; no commit created."
          fi
